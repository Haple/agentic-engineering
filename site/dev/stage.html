<!doctype html>
<html><head><meta charset="utf-8"><title>stage</title>
<link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/lesson.css">
<style>html,body{margin:0;background:#222;overflow:hidden}</style></head>
<body><div id="stage" class="stage"></div>
<script src="/js/gsap.min.js"></script><script src="/js/art.js"></script><script src="/js/templates.js"></script><script src="/js/engine.js"></script>
<script>
// /dev/stage.html?src=/data/xyz.json&portrait=1&mode=capture&t=12
const q = new URLSearchParams(location.search);
window.__ready = (async () => {
  const data = await (await fetch(q.get("src"))).json();
  await document.fonts.ready;
  const L = new AE.Lesson(document.getElementById("stage"), data, { mode: q.get("mode") || "capture", portrait: q.get("portrait") === "1" });
  window.L = L; window.__seek = (t) => L.seek(t); window.TOTAL = L.total;
  L.seek(+(q.get("t") || 0));
  return true;
})();
</script></body></html>
